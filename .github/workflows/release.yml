name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: 构建 debug APK
        run: ./gradlew :app:assembleDebug
      - name: 重命名产物
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/DayMark-${GITHUB_REF_NAME}-debug.apk"
          ls -lh dist
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/DayMark-${GITHUB_REF_NAME}-debug.apk" \
            --title "DayMark ${GITHUB_REF_NAME}" \
            --generate-notes
